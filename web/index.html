<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23e8a33d'/></svg>" />
    <title>Luxel</title>
  </head>
  <body>
    <div id="app"></div>
    <!--
      This tag is the page's ONLY browser-native subresource request (the
      stylesheet is inlined at build time). On a device that request is the one
      a full 3-socket pool refuses, and nothing retries a native tag — so the
      PRODUCTION build does not emit it as a tag at all: `inlineBoot()` in
      vite.config.ts rewrites it into a small loader that appends the script
      once the document is parsed (reusing the document's keep-alive socket
      instead of racing it for a second one) and re-appends it with backoff if
      it is refused. Gitea #592. Dev keeps the plain tag.
    -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
