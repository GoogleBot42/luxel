# Luxel firmware — ESP32-C3 first (RISC-V, mainline Rust). Standalone
# workspace: it builds for a different target than the host crates.
[package]
name = "luxel-fw"
version = "0.1.37"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
esp-hal = { version = "1.1.0", features = ["unstable"] }
esp-alloc = "0.10"
esp-println = { version = "0.17", features = ["log-04"] }
esp-backtrace = { version = "0.19", features = ["panic-handler", "println", "custom-halt"] }
esp-bootloader-esp-idf = "0.5"
critical-section = "1"
embedded-storage = "0.3"
esp-storage = { version = "0.9", features = ["embedded-storage"] }
# Pattern library: an established KV-over-NOR store (wear-leveled,
# power-loss-safe) instead of a hand-rolled blob (PLAN.md storage model).
# sequential-storage is async-first; a small local adapter (patterns.rs)
# bridges esp-storage's blocking FlashStorage to these async NorFlash traits.
sequential-storage = "4"
embedded-storage-async = "0.4"
# default-features = false drops the "frontend" (lexer/parser/compiler):
# the device only executes LXBC bytecode compiled by the browser/CLI.
luxel-core = { path = "../crates/luxel-core", default-features = false }

# networking (WiFi station + async TCP + HTTP server)
esp-rtos = { version = "0.3", features = ["esp-radio", "embassy", "log-04"] }
esp-radio = { version = "1.0.0-beta.0", features = ["wifi", "unstable"] }
embassy-executor = "0.10"
embassy-net = { version = "0.9", features = ["dhcpv4", "dhcpv4-hostname", "medium-ethernet", "tcp", "dns", "udp", "multicast"] }
heapless = { version = "0.9", default-features = false }
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-futures = "0.1"
static_cell = "2.1"
picoserve = { version = "0.18", default-features = false, features = ["embassy", "alloc"] }
# MQTT (Home Assistant integration): established no_std MQTT v5 client over
# any embedded-io-async transport. embassy-net 0.9 implements embedded-io
# 0.7 but rust-mqtt wants 0.6 — mqtt.rs has a paper-thin adapter, hence the
# explicit 0.6 deps here.
rust-mqtt = { version = "0.3", default-features = false }
embedded-io = "0.6"
embedded-io-async = "0.6"
edge-dhcp = { version = "0.8", default-features = false }

# build.rs compiles the built-in default pattern to LXBC at build time
# (host-target build dep — the frontend never enters the firmware image).
# esp-idf-part serializes partitions.csv to the binary table format for
# src/takeover.rs (same crate espflash uses, so the bytes match what a
# serial flash would put at 0x8000).
[build-dependencies]
luxel-core = { path = "../crates/luxel-core" }
esp-idf-part = "0.6"

[features]
# Boards (pick exactly one; they pull in the right chip). See docs/firmware.md.
default = ["board-c3-devkit"]
board-c3-devkit = ["esp32c3"]
board-athom-music = ["esp32"]
board-pixelblaze-v3 = ["esp32"]
board-esp32-generic = ["esp32"]
# RAM-constrained profile (S2/C2 tier, see docs/boards.md): web pool 3→2
# (+8 KB heap on esp32) at the cost of an occasionally-refused FIRST
# browser navigation — Chromium preconnect wants 3 sockets at cold nav.
small-chip = []

# Chip features (selected via a board feature, not directly).
esp32c3 = [
  "esp-hal/esp32c3",
  "esp-println/esp32c3",
  "esp-backtrace/esp32c3",
  "esp-bootloader-esp-idf/esp32c3",
  "esp-rtos/esp32c3",
  "esp-radio/esp32c3",
  "esp-storage/esp32c3",
]
# Classic ESP32 (Xtensa — Athom music-reactive WLED controller and other
# WROOM boards). Needs espup's rustc fork; see build-esp32.sh.
esp32 = [
  "esp-hal/esp32",
  "esp-println/esp32",
  "esp-backtrace/esp32",
  "esp-bootloader-esp-idf/esp32",
  "esp-rtos/esp32",
  "esp-radio/esp32",
  "esp-storage/esp32",
]

# opt-level "s" (size), not 3: the app crossed the 1 MiB OTA-slot boundary at
# v0.1.17 (crossfade). "s" reclaims ~5% with no visible render-rate hit — the
# VM eval loop is not the bottleneck (SPI/embassy pacing dominate frame time).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1

[workspace]

# Pin the esp-hal stack to git main: esp-radio 1.0.0-beta.0 (crates.io)
# crashes on classic ESP32 in the PHY calibration path (wifi_track_pll_cap /
# pm_on_beacon_rx null-ish calls on first TX burst); the fixes landed after
# the release ("Re-enable phy-disable/enable (ESP32/ESP32-S2)" #5774 and
# "pair combo-module PHY init with Wi-Fi RX toggle" #5776, both June 2026).
# All crates must move together — same repo, same rev.
[patch.crates-io]
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "7c7f3726b7f1ccb784e0ca5ced06f96f0baf90b7" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "7c7f3726b7f1ccb784e0ca5ced06f96f0baf90b7" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", rev = "7c7f3726b7f1ccb784e0ca5ced06f96f0baf90b7" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "7c7f3726b7f1ccb784e0ca5ced06f96f0baf90b7" }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "7c7f3726b7f1ccb784e0ca5ced06f96f0baf90b7" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", rev = "7c7f3726b7f1ccb784e0ca5ced06f96f0baf90b7" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "7c7f3726b7f1ccb784e0ca5ced06f96f0baf90b7" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", rev = "7c7f3726b7f1ccb784e0ca5ced06f96f0baf90b7" }
