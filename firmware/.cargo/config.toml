[build]
# Default: ESP32-C3 devkit (feature esp32c3). For the classic-ESP32 build
# (feature esp32, Xtensa) use ./build-esp32.sh — it selects the target and
# toolchain explicitly.
target = "riscv32imc-unknown-none-elf"

[target.'cfg(target_arch = "riscv32")']
runner = "espflash flash --monitor --partition-table=partitions.csv"
rustflags = ["-C", "link-arg=-Tlinkall.x", "-C", "force-frame-pointers"]

[target.'cfg(target_arch = "xtensa")']
runner = "espflash flash --monitor --partition-table=partitions.csv"
rustflags = [
  # GNU LD from espup's xtensa-esp-elf toolchain
  "-C", "link-arg=-Wl,-Tlinkall.x",
  "-C", "link-arg=-nostartfiles",
]

[env]
# Bring-up diagnostics: log every RTOS task creation (name, entry fn,
# stack, core) — needed to identify which task's entry pointer gets
# corrupted in the esp32 null-call crash.
ESP_LOG = "info,esp_rtos::task=debug"
# Bring-up: make stack overflows fail loudly (named panic) instead of
# corrupting memory. Range-check + HW watchpoint are on by default; this
# adds the software guard check on RTOS task switches too.
ESP_RTOS_CONFIG_SW_TASK_OVERFLOW_DETECTION = "true"
