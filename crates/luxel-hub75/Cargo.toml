[package]
name = "luxel-hub75"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Row-oriented bulk bitplane packer for HUB75 BCM framebuffers"

[features]
# The ESP32-S3 PIE vector kernel in src/pie.rs (inline asm; Xtensa only —
# elsewhere `pie::pack_pie` runs the portable model). The firmware's
# `hub75-pie` feature turns it on; nothing else should.
pie = []

[dependencies]
# The arrangement this crate remaps for IS `luxel_core::layout::Matrix` —
# reused rather than restated. `default-features = false` keeps the compiler
# frontend out of the firmware graph (the firmware depends on luxel-core the
# same way; the two unify to "off").
luxel-core = { path = "../luxel-core", default-features = false }

[dev-dependencies]
# The real framebuffer the firmware drives — the tests build a reference
# image through its per-pixel `set_pixel` path and require the packer to be
# byte-identical to it. Feature set matches what the S3 firmware resolves
# (defaults: no esp32-ordering, no inter-row blank, no tail word).
hub75-framebuffer = "0.11"
embedded-graphics = { version = "0.8", default-features = false }
# Real rendered frames for the equality tests, straight from library/*.js —
# fixtures would go stale, the engine does not.
luxel-core = { path = "../luxel-core" }
