[package]
name = "luxel-core"
version = "0.1.0"
description = "Portable compiler + 16.16 fixed-point VM for the Luxel pattern language (Pixel Blaze pattern-language compatible)"
edition.workspace = true
license.workspace = true

[dependencies]
allocator-api2 = { version = "0.3", default-features = false, features = ["alloc"] }
logos = { version = "0.15", default-features = false, features = ["export_derive"], optional = true }

[features]
default = ["frontend", "panel", "kinds", "jit"]
# The lexer/parser/compiler. Off = execute-only builds (device firmware):
# patterns arrive as LXBC bytecode and the frontend never gets linked.
frontend = ["dep:logos"]
# The panel half of a Layout (#475): the refresh estimate and driven-tile
# count `GET /api/layout` reports on a board with a HUB75 driver. Off =
# `View` has no `panel` field and `push_json` emits nothing for it, so a
# strip board's image is byte-identical to one built before it existed.
# The firmware turns it on from its own `hub75` feature.
panel = []
# Kind inference + the LXBC v6 stack-map verifier (Gitea #607,
# docs/jit-design.md §2). ON by default, so the browser wasm, the CLI and
# the mirror all compute kinds and check every blob they decode. The
# FIRMWARE depends on luxel-core with `default-features = false` and must
# NOT name it: a board with no JIT backend only has to read PAST the kinds
# section, which the decoder does whether or not this is on. Turning it on
# costs the inference, the verifier and their error strings.
kinds = []
# The JIT's ABI surface (Gitea #642, docs/jit-design.md §3.2/§3.8/§4):
# `JitCtx`, the `BuiltinEntry` table and the `RetDyn` return shape. NO
# emitter and no native code — phase 1 ships the layout, `const`-asserted
# and differentially tested against the interpreter on the host. Implies
# `kinds`: the table's `ret_kind` column IS `vm::builtin_sig`, evaluated at
# compile time, which keeps the inference and the JIT from disagreeing.
#
# ON by default, like `kinds`, so the browser wasm, the CLI and every
# `cargo test` carry it. The FIRMWARE depends on luxel-core with
# `default-features = false` and does not name it, so a board with no
# backend pays nothing for the table.
jit = ["kinds"]
# Route the interpreter's `CallBuiltin` through `BUILTIN_ENTRIES[id].generic`
# instead of walking the three-tier ladder inline (docs/jit-design.md §4).
# OFF EVERYWHERE and meant to stay that way until the Seengreat A/B says
# otherwise: #328 showed the tiers are an I-cache budget, and whether one
# indirect call through a table beats them is a measurement, not an opinion.
# Does NOT imply `jit` — the firmware A/B build must carry the table and
# nothing else, so the module compiles under either feature.
dispatch-table = []
depth-probe = []
# Dynamic opcode/bigram/builtin counters in the VM loop (`luxel bench
# --profile`, tools/profile-library.mjs). Host tooling only: the firmware
# never enables it, so no device image carries a counter or a branch.
profile = []
# Code placement (Gitea #312/#328): execute the interpreter's per-pixel
# native code from `.rwtext` (internal SRAM) instead of through the flash
# instruction cache. `#[link_section = ".rwtext"]` is what `esp_hal::ram`
# expands to, spelled by hand because this crate must not depend on
# esp-hal. DEVICE-ONLY — on a host target `.rwtext` is a stray section
# name, so a host/wasm build must never enable these.
#
# Enabled from the firmware through its own same-named features, chosen
# per board by `IRAM` in firmware/board-target.sh (mirrored by `iram` in
# flake.nix); `IRAM_OFF=1 ./build-esp32.sh` is the A/B lever. Worth
# 2.9-4.2x on builtin-heavy patterns on the classic ESP32 and ~1 % on the
# S3 — see docs/firmware.md "Code placement" and docs/boards.md
# "IRAM budget" before changing what is in them.
iram-vm = []        # Vm::run                                    (13,572 B)
iram-builtins = []  # Vm::call_builtin + Vm::builtin_hot          (7,304 B)
# hsv_to_rgb, the fmath a render body reaches every pixel (sin/cos in turns
# and radians, sqrt/isqrt48, hypot, exp2/log2/pow, atan2) and the noise
# entry points.
iram-math = []      #                                             (9,412 B)
