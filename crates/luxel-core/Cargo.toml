[package]
name = "luxel-core"
version = "0.1.0"
description = "Portable compiler + 16.16 fixed-point VM for the Luxel pattern language (Pixel Blaze pattern-language compatible)"
edition.workspace = true
license.workspace = true

[dependencies]
logos = { version = "0.15", default-features = false, features = ["export_derive"], optional = true }

[features]
default = ["frontend"]
# The lexer/parser/compiler. Off = execute-only builds (device firmware):
# patterns arrive as LXBC bytecode and the frontend never gets linked.
frontend = ["dep:logos"]
depth-probe = []
# Dynamic opcode/bigram/builtin counters in the VM loop (`luxel bench
# --profile`, tools/profile-library.mjs). Host tooling only: the firmware
# never enables it, so no device image carries a counter or a branch.
profile = []
# Gitea #312 experiment knobs: place the interpreter's hot functions in
# `.rwtext` (internal SRAM) instead of letting them execute from the
# cache-mapped flash text. Device-only — a host build must never enable
# them. Enabled from the firmware through its own `iram-vm` /
# `iram-builtins` features (firmware/Cargo.toml), i.e.
#   EXTRA_FEATURES=iram-vm BOARD=board-seengreat-hub75 ./build-esp32.sh
iram-vm = []
iram-builtins = []
