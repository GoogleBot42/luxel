[package]
name = "luxel-cli"
version = "0.1.0"
description = "Native CLI for the Luxel pattern language: parse (and soon run) patterns on the desktop"
edition.workspace = true
license.workspace = true

[[bin]]
name = "luxel"
path = "src/main.rs"

[features]
# NOT default: the counters cost real time in the dispatch loop (a BTreeMap
# insert per instruction), which would make `luxel bench` measure the
# profiler. tools/profile-library.mjs builds with it into its own target dir.
default = []
# `luxel bench --profile` — dynamic opcode counters in luxel-core's VM loop.
# Host-only by construction: the firmware crate depends on luxel-core with
# default-features = false and never names this.
profile = ["luxel-core/profile"]

[dependencies]
luxel-core = { path = "../luxel-core" }
# `--board panel` answers the same refresh estimate the firmware does, from
# the same code — the mirror must not carry a second copy of the formula.
luxel-hub75 = { path = "../luxel-hub75" }
rumqttc = "0.24"
# `luxel sprite import` decodes PNG/GIF/JPEG/WebP/BMP (Gitea #784). Host-only
# and CLI-only: luxel-core must stay `no_std`, and the firmware never decodes
# an image. Default features are OFF so the tree is the five codecs the web
# importer accepts and nothing else (no rayon, no TIFF/EXR/DDS/...).
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp", "bmp"] }
serde_json = "1"

[dev-dependencies]
dhat = "0.3.3"
serde = { version = "1", features = ["derive"] }
