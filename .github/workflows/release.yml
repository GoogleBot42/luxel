name: release

# Publishes a release when a `vX.Y.Z` tag arrives.
#
# This GitHub repo is a READ-ONLY DOWNSTREAM MIRROR of the Gitea source of
# truth (git.neet.dev/zuckerberg/luxel, Tailscale-only). Tags are cut on
# Gitea (.gitea/workflows/cut-release.yml or tools/release.sh) and reach
# here via the push mirror; this workflow's only job is to build and attach
# release assets to the mirrored tag. It must NEVER create commits or tags —
# that would diverge from the mirror. Hence: no workflow_dispatch on tags;
# the version in firmware/Cargo.toml is the source of truth and must already
# equal the tag (cut-release validates that before the tag leaves Gitea).
#
# Assets per release (see docs/releases.md for what each is for):
#   luxel-<board>-<ver>-ota.bin   app-only image: POST /api/ota, and the
#                                 image WLED's /update page accepts for the
#                                 WLED→Luxel takeover (docs/wled-migration.md)
#   luxel-<board>-<ver>-full.bin  full-flash image incl. bootloader,
#                                 partition table, app AND the web assets:
#                                 espflash write-bin 0x0 <file>
#   luxel-c6-devkit-hosted-…      the same two images for the hosted-UI
#                                 build (Gitea #11): no on-device web app,
#                                 so the -full.bin leaves the assets
#                                 partition erased. See docs/boards.md.
#   luxel-<board>-<ver>.luxr      release PACKAGE: the app image AND the web
#                                 assets in one container, installed as one
#                                 action by the console's Settings ->
#                                 Firmware & recovery -> Update... (Gitea
#                                 #643). Absent for the hosted-UI build,
#                                 which serves no on-device console.
#   luxel-web-assets-<ver>.luxa   the packed web app alone: POST /api/assets
#   luxel-web-dist-<ver>.tar.gz   the playground as plain static files
#                                 (host anywhere; playground mode needs no
#                                 device)
#   luxel-elfs-<ver>.tar.gz       per-board ELFs for symbolicating panic
#                                 backtraces (tools/decode-backtrace.sh)
#   sha256sums.txt
#
# IMPORTANT: release images are built with the flake's PURE evaluation, so
# they bake NO WiFi credentials (a pure build cannot see the environment).
# A credless device boots into AP-mode provisioning (open AP luxel-XXXX,
# captive portal) — that is the intended public setup path. Never wire
# creds into this workflow.
#
# The job is idempotent: re-running upserts the release and re-uploads
# missing assets.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # create releases + upload assets (never commits)

# MIGRATING_RELEASE=1 (set here from #501, 2026-09-20, to #676, 2026-09-24)
# weighed every image against the OLD 1 MiB OTA slot, for the one release a
# not-yet-repartitioned device would install into that slot. The classic
# ESP32 JIT tier ended it: those images are ~1,120 KB and only fit the
# 1.25 MiB slots of #641, which Jeremy accepted as the floor. A device still
# on the old table takes a `JIT_OFF=1` build first (docs/boards.md "The
# migrating release"); this workflow gates the normal images against their
# own slots with the 3 % floor (tools/image-check.sh).
jobs:
  release:
    # Gitea Actions also picks up .github/workflows/ — this guard makes sure
    # the heavy build only ever runs on GitHub's runners, never on the Gitea
    # runner (which has no nix).
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 3× Xtensa -Zbuild-std release builds are slow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0   # full history for release notes

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve and verify version
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' \
            || { echo "::error::invalid tag '$GITHUB_REF_NAME' (expected vX.Y.Z)"; exit 1; }
          TOML="$(sed -n 's/^version = "\(.*\)"$/\1/p' firmware/Cargo.toml | head -1)"
          [ "$TOML" = "$V" ] || { echo "::error::firmware/Cargo.toml ('$TOML') != tag version ('$V'). Tags are cut from Gitea (cut-release), which validates this — do not hand-create tags."; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"
          echo "Release v$V"

      - name: Build web app + pack assets
        # The devshell provides node + stable rust with the wasm target (the
        # web build compiles luxel-wasm). Also produces the plain static
        # dist/ for hosting the playground anywhere.
        #
        # web/public is gitignored build output — it must exist before
        # `npm run wasm`'s cp step (same gotcha as fresh worktrees).
        #
        # A fresh clone has no corpus/, so the packed gallery is built from
        # the clean-room library/ alone and pixelblaze-library.json is NOT
        # produced — deliberate: the scraped corpus is never redistributed
        # (rehearsed 2026-08-15: 5-file LUXA, ~615 KB).
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            mkdir -p web/public dist-luxa
            cd web
            npm ci
            npm run build
            node tools/pack-assets.mjs ../dist-luxa/web-assets.luxa
          '
          mkdir -p dist
          V=${{ steps.ver.outputs.version }}
          cp dist-luxa/web-assets.luxa "dist/luxel-web-assets-$V.luxa"
          tar -C web/dist -czf "dist/luxel-web-dist-$V.tar.gz" .
          # the LUXA must fit the 0x0F0000 assets partition — the SMALLEST
          # one in the fleet (partitions.csv; the 16 MB board's is 0x3F0000),
          # and one bundle ships to all of them, so the small one is the bound
          LUXA_MAX=$((0x0F0000))
          SZ=$(stat -c%s dist-luxa/web-assets.luxa)
          [ "$SZ" -le "$LUXA_MAX" ] || { echo "::error::web-assets.luxa ($SZ B) exceeds the assets partition ($LUXA_MAX B)"; exit 1; }

      - name: Build firmware (all boards)
        # Pure nix builds: credless by construction (see header note).
        # Sequential in one job so the Xtensa toolchain downloads once.
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p elfs
          # s3-devkit/c6-devkit/s3-hub75/seengreat-hub75 are UNTESTED ON METAL
          # (no bench hardware) — they ship as build artifacts only; see
          # docs/boards.md.
          # The C6 ships ONLY as c6-devkit-hosted since 2026-09-06 (Gitea
          # #281): its on-device-UI build fell under image-check's 3 %
          # OTA-slot floor, and the hosted-UI image is the lever
          # docs/boards.md recorded for that. Restoring the full-UI C6
          # artifact is Gitea #291.
          for board in c3-devkit pixelblaze-v3 athom-music esp32-generic s3-devkit s3-hub75 seengreat-hub75 c6-devkit-hosted; do
            echo "::group::luxel-fw-$board"
            # extra cargo features per variant, for image-check's
            # feature-gated markers. seengreat-hub75 gets `hub75` from its
            # own board feature, but image-check still has to expect it;
            # *-hosted asserts the asset reader is GONE (image-check's
            # absent-marker half).
            EXTRAS=""
            case "$board" in
              *hub75) EXTRAS="hub75";;
              *-hosted) EXTRAS="hosted-ui";;
            esac
            # …and the board feature, so image-check asserts each artifact
            # really is the board it is named after (Gitea #389). The
            # variant name is not always the board: s3-hub75 is
            # board-s3-devkit + hub75, c6-devkit-hosted is board-c6-devkit.
            # Keep in step with flake.nix's firmwareVariants `board`.
            case "$board" in
              s3-hub75)          EXTRAS="$EXTRAS board-s3-devkit";;
              c6-devkit-hosted)  EXTRAS="$EXTRAS board-c6-devkit";;
              *)                 EXTRAS="$EXTRAS board-$board";;
            esac
            # Where the web bundle is written into the merged image. Per
            # board since Gitea #501: the 16 MB table (board-seengreat-hub75)
            # puts assets at 0xA10000, the 4 MB one at 0x310000, and the old
            # literal would have landed the bundle in the middle of ota_1 on
            # the 16 MB board. Read it out of the very csv the image was
            # merged with, same as firmware/build-esp32.sh does.
            BOARD_FEAT=""
            for e in $EXTRAS; do case "$e" in board-*) BOARD_FEAT="$e";; esac; done
            ASSETS_OFF=$( . firmware/board-target.sh
                          board_partitions "$BOARD_FEAT"
                          awk -F, '$1 ~ /^[[:space:]]*assets[[:space:]]*$/ {
                                     gsub(/[[:space:]]/, "", $4); print $4; exit }' \
                              "firmware/$PARTITIONS" )
            [ -n "$ASSETS_OFF" ] || { echo "::error::no assets row for $BOARD_FEAT"; exit 1; }
            echo "assets partition offset for $board: $ASSETS_OFF"
            nix build ".#luxel-fw-$board" --print-build-logs --out-link "result-$board"
            # load-bearing features must be linked (the //SIZETEST guard) AND
            # the app image must keep a margin in its OTA slot (per board
            # since #501; EXPECT_FEATURES names the board, so image-check
            # resolves the slot itself) — both live in image-check.sh; the
            # margin floor is Gitea #160.
            EXPECT_FEATURES="$EXTRAS" tools/image-check.sh "result-$board/luxel-fw-ota.bin" \
              || { echo "::error::$board image failed tools/image-check.sh (missing load-bearing feature, or too little OTA-slot margin — see its output above)"; exit 1; }
            cp "result-$board/luxel-fw-ota.bin" "dist/luxel-$board-$V-ota.bin"
            # full image = merged (bootloader + partitions + app, 0xFF-padded
            # to the table's flash size) with the web assets written into
            # their partition — the same composition as
            # firmware/build-esp32.sh `image`
            cp "result-$board/luxel-fw.bin" "dist/luxel-$board-$V-full.bin"
            chmod +w "dist/luxel-$board-$V-full.bin"
            # hosted-UI images have no asset reader — leave their assets
            # partition erased rather than shipping a bundle nothing serves
            case "$board" in
              *-hosted) ;;
              *) dd if=dist-luxa/web-assets.luxa "of=dist/luxel-$board-$V-full.bin" \
                    bs=4096 seek=$((ASSETS_OFF / 4096)) conv=notrunc status=none;;
            esac
            # ...and the one-file release package: this board's app image
            # plus the web assets built from this same commit (Gitea #643).
            # A device that takes the firmware without the console that
            # matches it goes dark across an LXBC format bump, so the
            # package exists to make the two arrive together. Packed by the
            # same web/tools/pack-luxr.mjs tools/deploy.sh uses, and named
            # by board::NAME so the console can refuse a wrong-board file.
            # Hosted-UI images serve no console, so they get no package.
            case "$board" in
              *-hosted) ;;
              *) BOARD_NAME=$( . firmware/board-target.sh
                               board_name "$BOARD_FEAT"
                               printf '%s' "$BOARD_NAME" )
                 nix develop --command bash -c "cd web && node \
                   --experimental-strip-types --disable-warning=ExperimentalWarning \
                   tools/pack-luxr.mjs --board '$BOARD_NAME' --version '$V' \
                   --app '../result-$board/luxel-fw-ota.bin' \
                   --assets '../dist-luxa/web-assets.luxa' \
                   '../dist/luxel-$board-$V.luxr'" ;;
            esac
            cp "result-$board/luxel-fw.elf" "elfs/luxel-$board-$V.elf"
            echo "::endgroup::"
          done
          tar -czf "dist/luxel-elfs-$V.tar.gz" -C elfs .

      - name: Checksums + stage summary
        run: |
          cd dist
          sha256sum -- * > sha256sums.txt
          echo "--- release assets ---"; ls -l

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Firmware images are **credential-free**: a freshly flashed device
            boots an open `luxel-xxxx` WiFi access point with a captive-portal
            setup page — join it and enter your WiFi there.

            - **WLED device takeover**: use the [installer page](https://googlebot42.github.io/luxel/flash.html), or upload `luxel-<board>-*-ota.bin` via WLED's update page
            - **New device** (or full reset): `espflash write-bin 0x0 luxel-<board>-*-full.bin`
            - **Update an installed device**: open its console, Settings → Advanced → Firmware & recovery → **Update…**, and pick `luxel-<board>-*.luxr` — it installs the firmware and the matching web app in one action
            - **Update over the network (firmware only)**: `curl --data-binary @luxel-<board>-*-ota.bin http://<device>/api/ota` — follow it with the web-assets push below, or the device keeps serving the console that shipped with its old firmware
            - **Web app only**: `curl --data-binary @luxel-web-assets-*.luxa http://<device>/api/assets`

# The installer site (GitHub Pages) is deployed by pages.yml, which this
# workflow's published release triggers — see that file and
# docs/releases.md.
