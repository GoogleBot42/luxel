# Host test rig for firmware/src/patlog.rs — the pattern store's packed,
# append-only file format (record layout, the boot scan, append planning,
# compaction placement). It compiles the exact on-device source file for
# the host so its unit tests run under `cargo test --workspace`; it is a
# workspace member for exactly that reason (unlike wledfs-check, which
# needs real filesystem dumps and stays standalone).
#
#   cargo test -p patlog-check
[package]
name = "patlog-check"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]

# The library-fill test compiles every library/*.js with the real compiler
# and packs the results, so the "how many patterns fit" number is measured
# against real bytes rather than assumed.
[dev-dependencies]
luxel-core = { path = "../../crates/luxel-core" }
